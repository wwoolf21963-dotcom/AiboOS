name: SPHYD stage 2 public firmware routine inventory
on:
  workflow_dispatch:
  push:
    branches: [wifi-n69u-bringup]
    paths:
      - 'iphone-se/research/s8000-phy-kernel-audit.py'
      - '.github/workflows/s8000-phy-kernel-audit.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python iphone-se/research/s8000-phy-kernel-audit.py --selftest
      - run: python -m pip install lzfse==0.4.2
      - run: python iphone-se/research/s8000-phy-kernel-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: S8000-PHY-PCIe-Identifier-Inventory
          path: s8000-phy-audit/kernel-pcie-inventory.json
          if-no-files-found: error
