name: AiboOS 1.8 Web Test (Pages optional)

on:
  push:
    branches: [main]
    paths:
      - 'AiboOS/Web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aiboos-web-pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout AiboOS web source
        uses: actions/checkout@v4
      - name: Check browser app files
        run: |
          set -euo pipefail
          test -s AiboOS/Web/index.html
          test -s AiboOS/Web/logo.svg
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('AiboOS/Web/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.DOTALL)
          if not scripts: raise SystemExit('AiboOS script not found')
          import subprocess
          for i, script in enumerate(scripts):
              output=f'/tmp/aiboos-web-{i}.js'
              Path(output).write_text(script)
              subprocess.run(['node','--check',output],check=True)
          print('Checked all',len(scripts),'inline browser scripts')
          PY
          node --check AiboOS/Web/message-storage.js
      - name: Direct browser preview (works without GitHub Pages)
        run: |
          echo '### AiboOS 1.8 browser test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the [AiboOS 1.8 web preview](https://raw.githack.com/wwoolf21963-dotcom/AiboOS/main/AiboOS/Web/index.html).' >> "$GITHUB_STEP_SUMMARY"
          echo 'This third-party GitHack preview reads our public GitHub source. Do not use it for sensitive messages. It is independent of GitHub Pages.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check if GitHub Pages has been enabled
        id: check_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Pages is enabled: proceed with GitHub Pages deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Pages is not enabled yet. Pages deployment skipped; browser preview link above works independently.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy_pages:
    needs: preview
    if: needs.preview.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AiboOS web source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload AiboOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./AiboOS/Web
      - name: Publish AiboOS to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
