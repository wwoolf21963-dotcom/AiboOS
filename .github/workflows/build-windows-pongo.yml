name: Build AiboOS Windows Native Pongo USB Stage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-pongo.yml'
      - 'windows-pongo/**'

permissions:
  contents: read

concurrency:
  group: aiboos-windows-native-pongo
  cancel-in-progress: true

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MSYS2 and Windows libusb compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libusb
      - name: Compile native Windows Pongo USB utility
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/windows-pongo
          gcc -std=c11 -O2 -Wall -Wextra -Werror windows-pongo/aiboos-pongo.c -o dist/windows-pongo/aiboos-pongo.exe -lusb-1.0
          cp /mingw64/bin/libusb-1.0.dll dist/windows-pongo/
          cp windows-pongo/Start-Windows-USB-Check.cmd dist/windows-pongo/
          cp windows-pongo/README_FIRST.txt dist/windows-pongo/
          ./dist/windows-pongo/aiboos-pongo.exe --selftest
          ./dist/windows-pongo/aiboos-pongo.exe --list
          ./dist/windows-pongo/aiboos-pongo.exe --help
          (cd dist/windows-pongo && sha256sum aiboos-pongo.exe libusb-1.0.dll > SHA256SUMS.txt)
      - name: Verify all Windows outputs
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows-pongo/aiboos-pongo.exe)) { throw "Missing native EXE" }
          if (-not (Test-Path dist/windows-pongo/libusb-1.0.dll)) { throw "Missing USB DLL" }
          & ./dist/windows-pongo/aiboos-pongo.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Windows selftest failed" }
      - name: Upload native Windows tool (NOT AN INSTALLER)
        uses: actions/upload-artifact@v4
        with:
          name: AiboOS-SE-Windows-Pongo-USB-Stage-EXPERIMENTAL
          path: dist/windows-pongo/
          retention-days: 30
          if-no-files-found: error
