name: Focused AiboOS root UUID regression test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone-se/native/aiboos-root-start.sh'
      - '.github/workflows/test-root-uuid.yml'
permissions:
  contents: read
jobs:
  uuid:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install BusyBox and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static e2fsprogs
      - name: Test exact UUID, corrupt signatures, short reads and unrelated filesystems
        shell: bash
        run: |
          set -euo pipefail
          S=iphone-se/native/aiboos-root-start.sh
          ID=2a1b0000-1234-4567-89ab-0123456789ab
          WRONG=00000000-0000-0000-0000-000000000000
          sh -n "$S"
          truncate -s 32M good.ext4
          mkfs.ext4 -q -F -U "$ID" good.ext4
          before=$(sha256sum good.ext4)
          /bin/busybox sh "$S" --match-uuid "$ID" good.ext4
          ! /bin/busybox sh "$S" --match-uuid "$WRONG" good.ext4
          ! /bin/busybox sh "$S" --match-uuid not-a-uuid good.ext4
          test "$(sha256sum good.ext4)" = "$before"
          cp good.ext4 bad.ext4
          printf '\000\000' | dd of=bad.ext4 bs=1 seek=1080 conv=notrunc status=none
          ! /bin/busybox sh "$S" --match-uuid "$ID" bad.ext4
          head -c 1100 good.ext4 > short.img
          ! /bin/busybox sh "$S" --match-uuid "$ID" short.img
          truncate -s 32M other.ext2
          mkfs.ext2 -q -F -U "$ID" other.ext2
          ! /bin/busybox sh "$S" --match-uuid "$ID" other.ext2
          dev=$(sudo losetup --find --show --read-only good.ext4)
          trap 'sudo losetup -d "$dev"' EXIT
          sudo /bin/busybox sh "$S" --match-uuid "$ID" "$dev"
          ! sudo /bin/busybox sh "$S" --match-uuid "$WRONG" "$dev"
          echo 'PASS: exact UUID detection, invalid input rejection and read-only block-device access.'
