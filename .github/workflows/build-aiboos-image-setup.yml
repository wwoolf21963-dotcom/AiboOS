name: Build AiboOS Windows OS Image Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aiboos-image-setup.yml'
      - 'windows-os-image-setup/**'
      - 'iphone-se/native/**'
      - '.github/workflows/build-aiboos-rootfs.yml'
permissions:
  contents: read
  actions: read
jobs:
  rootfs:
    uses: ./.github/workflows/build-aiboos-rootfs.yml
  setup:
    needs: rootfs
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: AiboOS-ARM64-Persistent-RootFS-DEVELOPMENT
          path: rootfs-artifact
      - uses: actions/download-artifact@v4
        with:
          name: AiboOS-iPhone-SE-ARM64-development-kit
          run-id: 44906030345
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kernel-artifact
      - uses: actions/download-artifact@v4
        with:
          name: AiboOS-Windows-DFU-Driver-Preparation-NOT-iOS-Replacement
          run-id: 44931020238
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: driver-artifact
      - name: Embed verified native filesystem
        shell: python
        run: |
          import gzip, hashlib, lzma, pathlib
          source = pathlib.Path("rootfs-artifact/AiboOS-ARM64-rootfs.ext4.xz")
          expected = pathlib.Path("rootfs-artifact/SHA256SUMS.txt").read_text().split()[0]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          out = pathlib.Path("windows-os-image-setup")
          digest = hashlib.sha256()
          count = 0
          with lzma.open(source, "rb") as src, gzip.open(out / "payload.gz", "wb", compresslevel=6) as dest:
              while chunk := src.read(1024 * 1024):
                  count += len(chunk)
                  assert count <= 256 * 1024 * 1024
                  digest.update(chunk)
                  dest.write(chunk)
          assert count == 256 * 1024 * 1024
          (out / "payload.sha256").write_text(digest.hexdigest())
      - name: Package verified native Linux kernel and A9 device trees
        shell: python
        run: |
          import hashlib, pathlib, zipfile, struct, gzip
          root = pathlib.Path("kernel-artifact")
          out = pathlib.Path("windows-os-image-setup")
          expected = {}
          for line in (root / "SHA256SUMS.txt").read_text().splitlines():
              checksum, name = line.split(maxsplit=1)
              expected[name.lstrip("*")] = checksum.lower()
          names = ["Image.gz", "apple-dtbs/s8000-n69u.dtb", "apple-dtbs/s8003-n69.dtb"]
          for name in names:
              data = (root / name).read_bytes()
              assert data and hashlib.sha256(data).hexdigest() == expected[name], name
          with gzip.open(root / "Image.gz", "rb") as source:
              assert source.read(64)[56:60] == b"ARM\x64", "Not an ARM64 kernel Image"
          for name in names[1:]:
              data = (root / name).read_bytes()
              assert len(data) >= 40 and struct.unpack_from(">I", data)[0] == 0xd00dfeed
              assert struct.unpack_from(">I", data, 4)[0] == len(data)
          with zipfile.ZipFile(out / "native-files.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  z.write(root / name, name)
              z.write(root / "kernel-commit.txt", "kernel-commit.txt")
              z.writestr("SHA256SUMS.txt", "".join(expected[name] + "  " + name + "\n" for name in names))
              for name in ["aiboos-fb.c", "aiboos-usb-serial.sh", "README.md"]:
                  z.write(pathlib.Path("iphone-se/native") / name, "source/" + name)
              z.writestr("README.txt", "AiboOS native development files. Kernel from verified earlier build; updated userspace is in the separately embedded filesystem. The kernel and userspace have not been tested together on an iPhone. No phone-flashing or permanent boot mechanism included.\n")
          with zipfile.ZipFile(out / "native-files.zip") as z:
              assert z.testzip() is None
          (out / "native-files.sha256").write_text(hashlib.sha256((out / "native-files.zip").read_bytes()).hexdigest())
      - name: Publish standalone Windows executable
        shell: pwsh
        run: |
          dotnet publish windows-os-image-setup/AiboOS.ImageSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o setup-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test complete image extraction and verification
        shell: pwsh
        run: |
          $exe = Resolve-Path setup-output/AiboOS-Image-Setup.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Image setup self-test failed: $($p.ExitCode)" }
          Get-FileHash $exe -Algorithm SHA256
      - name: Include existing reviewed driver helper
        shell: pwsh
        run: |
          Copy-Item windows-linux-boot-assistant/Prepare-DFU-Driver.ps1 setup-output/
          Copy-Item driver-artifact/AiboOS-DFU-Driver-Tool.exe setup-output/
          Copy-Item driver-artifact/LIBWDI-*.txt setup-output/
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File setup-output/Prepare-DFU-Driver.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Driver helper self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: AiboOS-Windows-OS-Image-Setup-NOT-iPhone-Installer
          path: setup-output/
          if-no-files-found: error
          retention-days: 30
