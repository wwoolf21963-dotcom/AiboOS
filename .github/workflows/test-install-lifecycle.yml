name: Test AiboOS installation and restart in ARM64 VM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-install-lifecycle.yml'
      - '.github/scripts/test-install-lifecycle.sh'
permissions:
  contents: read
  actions: read
concurrency:
  group: aiboos-standalone-lifecycle
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified ARM64 filesystem from successful run
        uses: actions/download-artifact@v4
        with:
          name: AiboOS-ARM64-Persistent-RootFS-DEVELOPMENT
          run-id: 44966395287
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: current-rootfs
      - name: Restore exact virtual kernel build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aiboos-virtual-kernel-cache
          key: aiboos-virt-arm64-ef92d0d3b34a-defconfig-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install virtual machine and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm git clang lld llvm flex bison bc libssl-dev libelf-dev libncurses-dev dwarves zstd xz-utils cpio e2fsprogs rsync build-essential
      - name: Install, shut down and restart installed AiboOS
        run: |
          bash -n .github/scripts/test-install-lifecycle.sh
          bash .github/scripts/test-install-lifecycle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AiboOS-VM-Installation-Lifecycle-Report
          path: install-lifecycle-report/
          if-no-files-found: warn
