<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiboOS Setup</title>
<style>
:root{--pink:#ef5f7e;--purple:#bf5af2;--bg:#0e0b14;--bg2:#161020;--card:#1b1426;--card2:#221733;--edge:rgba(255,255,255,.08);--label:#f6f2fb;--muted:#b4a7c9;--green:#30d158;--amber:#ffc34d;--red:#ff5a6a}
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",system-ui,sans-serif;color:var(--label);min-height:100vh;padding:28px;display:grid;place-items:center;background:radial-gradient(1100px 650px at 82% -8%,rgba(191,90,242,.26),transparent 60%),radial-gradient(900px 560px at 8% 108%,rgba(239,95,126,.22),transparent 62%),var(--bg)}
.app{width:100%;max-width:560px}.shell{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--edge);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.head{display:flex;align-items:center;gap:14px;padding:24px 26px;background:linear-gradient(120deg,rgba(239,95,126,.16),rgba(191,90,242,.16));border-bottom:1px solid var(--edge)}
.mark{width:56px;height:56px;object-fit:contain;border-radius:14px;background:var(--card2)}h1{font-size:20px;margin:0 0 3px}p{margin:0;color:var(--muted);line-height:1.45}.body{padding:22px 26px 26px}.note{padding:12px 14px;border-radius:14px;background:rgba(255,195,77,.08);border:1px solid rgba(255,195,77,.27);color:#ffe2a6;font-size:12px;line-height:1.5;margin-bottom:16px}
.stages{display:grid;gap:9px}.stage{background:var(--card2);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}.ic{width:24px;text-align:center;font-size:19px;color:var(--muted);flex:none}.ok .ic{color:var(--green)}.error .ic{color:var(--red)}.blocked .ic{color:var(--amber)}.st-t{font-weight:600;font-size:13.5px}.st-d{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.4}
button{border:1px solid var(--edge);font:inherit;cursor:pointer;border-radius:14px;padding:12px 15px;color:var(--label);background:var(--card2)}button:disabled{opacity:.45;cursor:default}.cta{width:100%;font-weight:700;font-size:16px;background:linear-gradient(120deg,var(--pink),var(--purple));box-shadow:0 10px 25px rgba(191,90,242,.3);margin-top:16px}.buttons{display:flex;gap:8px;margin-top:9px}.buttons button{flex:1}.bar{height:10px;background:#241a33;border-radius:999px;overflow:hidden;margin:16px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));width:0;transition:width .25s}.foot{font-size:12px;text-align:center;margin-top:16px;color:var(--muted);overflow-wrap:anywhere}details{margin-top:14px;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main class="app"><div class="shell"><header class="head"><img class="mark" src="/logo.png" alt="AiboOS logo"><div><h1>AiboOS Setup</h1><p>iPhone SE (2016) · Native ARM64 development</p></div></header><div class="body">
<div class="note">Native Linux package — no iOS profiles or web shortcuts. Permanent iPhone storage installation is not implemented. The bundle is prepared on this computer only.</div>
<div class="stages" id="stages"></div><div class="bar"><i id="bar"></i></div><p id="progress">Image preparation: 0%</p>
<button class="cta" id="prepare">Prepare native AiboOS system</button>
<div class="buttons"><button id="scan">Refresh USB</button><button id="driver">Auto Install Drivers</button><button id="folder" disabled>Open files</button></div>
<p class="foot" id="status" aria-live="polite">Ready.</p><details><summary>Advanced information</summary><pre id="log"></pre></details>
</div></div></main><script>
const token="__TOKEN__";
const $=id=>document.getElementById(id);
async function api(path,post=false){const r=await fetch(path,{method:post?'POST':'GET',headers:{'X-AiboOS-Token':token}});if(!r.ok)throw Error('Setup request failed: '+r.status);return r.json()}
function render(s){$('stages').replaceChildren();for(const a of s.stages){const row=document.createElement('div');row.className='stage '+a.state;const ic=document.createElement('div');ic.className='ic';ic.textContent=({ok:'✓',blocked:'!',error:'×',active:'…'})[a.state]||'○';const box=document.createElement('div');const title=document.createElement('div');title.className='st-t';title.textContent=a.title;const detail=document.createElement('div');detail.className='st-d';detail.textContent=a.detail;box.append(title,detail);row.append(ic,box);$('stages').append(row)}$('bar').style.width=s.progress+'%';$('progress').textContent='Image preparation: '+s.progress+'%';$('status').textContent=s.status;$('log').textContent=s.log;$('prepare').disabled=s.busy;$('driver').disabled=s.busy||!s.driver_missing;$('scan').disabled=s.busy;$('folder').disabled=!s.ready||s.busy}
async function refresh(){try{render(await api('/status'))}catch(e){$('status').textContent=e.message}}
for(const [id,path] of [['prepare','/prepare'],['scan','/scan'],['driver','/driver'],['folder','/folder']])$(id).onclick=async()=>{try{if(id==='driver'&&!confirm('Prepare the Windows DFU driver? This may request administrator approval and will preserve a compatible driver.'))return;render(await api(path,true))}catch(e){$('status').textContent=e.message}};
refresh();setInterval(refresh,1000);
</script></body></html>
