name: AiboOS
options:
  bundleIdPrefix: dev.aiboos.se
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  AiboOS:
    type: application
    platform: iOS
    sources:
      - path: AiboOS/AppDelegate.swift
      - path: AiboOS/AiboNearby.swift
      - path: AiboOS/AiboFaceCheck.swift
      - path: AiboOS/LaunchScreen.storyboard
      - path: AiboOS/Assets.xcassets
      - path: AiboOS/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aiboos.se.prototype
        INFOPLIST_FILE: AiboOS/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
    scheme:
      testTargets: []
